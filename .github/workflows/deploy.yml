name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Authenticate with Fly
        uses: superfly/flyctl-actions@v2
        with:
          args: "auth token"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy postal-api
        run: fly deploy --config fly.toml --remote-only --strategy immediate

      - name: Deploy postal-worker
        run: fly deploy --config fly.worker.toml --remote-only --strategy immediate

      - name: Deploy postal-webhook-worker
        run: fly deploy --config fly.webhook-worker.toml --remote-only --strategy immediate

      - name: Deploy postal-web
        if: false
        run: fly deploy --config fly.web.toml --remote-only --strategy immediate
