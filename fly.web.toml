app = "postal-web"
primary_region = "iad"
auto_stop_machines = false
min_machines_running = 1
kill_signal = "SIGINT"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile.web"

[env]
  NODE_ENV = "production"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [services.http_checks]
    path = "/"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "get"
