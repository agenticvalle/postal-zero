version: '3.9'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postal_zero
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "" ,"--appendonly", "no"]
    ports:
      - '6379:6379'

  postal-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postal_zero?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-jwt-secret
      RECEIPT_SIGNING_SECRET: local-receipt-secret
      WEBHOOK_HMAC_SECRET: local-webhook-secret
      NODE_ENV: development
      LOG_LEVEL: debug
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 120
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis

  postal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "start:worker"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postal_zero?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-jwt-secret
      RECEIPT_SIGNING_SECRET: local-receipt-secret
      WEBHOOK_HMAC_SECRET: local-webhook-secret
      NODE_ENV: development
      LOG_LEVEL: debug
    depends_on:
      - postgres
      - redis

  postal-webhook-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "start:webhook-worker"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postal_zero?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-jwt-secret
      RECEIPT_SIGNING_SECRET: local-receipt-secret
      WEBHOOK_HMAC_SECRET: local-webhook-secret
      NODE_ENV: development
      LOG_LEVEL: debug
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
