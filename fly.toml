app = "postal-api"
primary_region = "iad"
auto_stop_machines = false
min_machines_running = 1
kill_signal = "SIGINT"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npm run prisma:deploy"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [services.http_checks]
    path = "/healthz"
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "get"
